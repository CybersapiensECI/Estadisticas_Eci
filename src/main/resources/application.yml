server:
  port: 8082
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  application:
    name: estadisticas-eci

  datasource:
    url: jdbc:h2:mem:estadisticas;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

services:
  gamification:
    url: http://localhost:8082
  event:
    url: http://localhost:8081
  parches:
    url: http://localhost:8080
  profile:
    url: https://alphaeci-profile-service-prod.icycoast-fc5305af.eastus.azurecontainerapps.io

jwt:
  secret: dev-secret-key-for-local-testing-only

---
spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/estadisticas_eci
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: public
    defer-datasource-initialization: false

  sql:
    init:
      mode: never
